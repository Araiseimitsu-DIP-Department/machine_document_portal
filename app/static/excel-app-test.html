<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excelアプリ起動テスト</title>
  <style>
    body { max-width: 42rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.6 system-ui, sans-serif; color: #17212b; }
    label { display: block; margin: 1.5rem 0 0.5rem; font-weight: 700; }
    input { box-sizing: border-box; width: 100%; padding: 0.8rem; font: inherit; }
    a, button { display: inline-block; margin: 1rem 0.5rem 0 0; padding: 0.75rem 1rem; border: 0; border-radius: 0.4rem; background: #1357a6; color: white; font: inherit; text-decoration: none; }
    a[hidden] { display: none; }
    #browser-link { background: #52616f; }
    #message { min-height: 1.5rem; }
  </style>
</head>
<body>
  <h1>Excelアプリ起動テスト</h1>
  <p>タブレットでSharePointのExcelファイルのリンクを貼り付け、下のボタンを押してください。ファイルの内容はこのページから送信・変更しません。</p>
  <label for="file-url">SharePointのExcelファイルへのリンク</label>
  <input id="file-url" type="url" inputmode="url" autocomplete="off" placeholder="https://…" aria-describedby="message">
  <p id="message" role="status"></p>
  <a id="excel-link" href="#" hidden>Excelアプリで開く</a>
  <a id="browser-link" href="#" hidden target="_blank" rel="noopener noreferrer">ブラウザで開く</a>
  <script>
    const input = document.getElementById('file-url');
    const message = document.getElementById('message');
    const excelLink = document.getElementById('excel-link');
    const browserLink = document.getElementById('browser-link');
    input.addEventListener('input', () => {
      let url;
      try { url = new URL(input.value.trim()); } catch { url = null; }
      const valid = url?.protocol === 'https:' && url.hostname.endsWith('.sharepoint.com');
      excelLink.hidden = browserLink.hidden = !valid;
      message.textContent = input.value && !valid ? 'SharePointのhttpsリンクを貼り付けてください。' : '';
      if (valid) {
        excelLink.href = `ms-excel:ofe|u|${url.href}`;
        browserLink.href = url.href;
      }
    });
  </script>
</body>
</html>
