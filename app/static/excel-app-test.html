<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excelアプリ起動テスト</title>
  <style>
    body { max-width: 42rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.6 system-ui, sans-serif; color: #17212b; }
    label { display: block; margin: 1.5rem 0 0.5rem; font-weight: 700; }
    input { box-sizing: border-box; width: 100%; padding: 0.8rem; font: inherit; }
    a, button { display: inline-block; margin: 1rem 0.5rem 0 0; padding: 0.75rem 1rem; border: 0; border-radius: 0.4rem; background: #1357a6; color: white; font: inherit; text-decoration: none; }
    a[hidden] { display: none; }
    #browser-link { background: #52616f; }
    #message { min-height: 1.5rem; }
  </style>
</head>
<body>
  <h1>Excelアプリ起動テスト</h1>
  <p>リンクを貼り付け、下のボタンを押してください。ファイルの内容やリンクはこのページから送信・変更しません。</p>
  <label for="file-url">Excelアプリ用：SharePointのファイル共有リンク</label>
  <input id="file-url" type="url" inputmode="url" autocomplete="off" placeholder="https://…" aria-describedby="message">
  <p id="message" role="status"></p>
  <label for="portal-url">ブラウザ用：ポータルの資料ボタンからコピーしたリンク</label>
  <p>ポータルで対象の資料ボタンを長押ししてリンクをコピーします。候補が複数ある場合は、候補一覧の対象ファイルの「開く」を長押ししてください。</p>
  <input id="portal-url" type="url" inputmode="url" autocomplete="off" placeholder="https://…" aria-describedby="portal-message">
  <p id="portal-message" role="status"></p>
  <a id="excel-link" href="#" hidden>Excelアプリで開く</a>
  <a id="browser-link" href="#" hidden target="_blank" rel="noopener noreferrer">ブラウザの別タブで開く</a>
  <script>
    const input = document.getElementById('file-url');
    const message = document.getElementById('message');
    const portalInput = document.getElementById('portal-url');
    const portalMessage = document.getElementById('portal-message');
    const excelLink = document.getElementById('excel-link');
    const browserLink = document.getElementById('browser-link');
    const parseSharePointUrl = (value) => {
      try {
        const url = new URL(value.trim());
        return url.protocol === 'https:' && url.hostname.endsWith('.sharepoint.com') ? url : null;
      } catch { return null; }
    };
    input.addEventListener('input', () => {
      const url = parseSharePointUrl(input.value);
      excelLink.hidden = !url;
      message.textContent = input.value && !url ? 'SharePointのhttpsリンクを貼り付けてください。' : '';
      if (url) {
        excelLink.href = `ms-excel:ofe|u|${url.href}`;
      }
    });
    portalInput.addEventListener('input', () => {
      const url = parseSharePointUrl(portalInput.value);
      browserLink.hidden = !url;
      portalMessage.textContent = portalInput.value && !url ? 'ポータルの資料ボタンからコピーしたSharePointのhttpsリンクを貼り付けてください。' : '';
      if (url) browserLink.href = url.href;
    });
  </script>
</body>
</html>
